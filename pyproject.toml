[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isaac-web-exporter"
version = "0.1.0"
description = "Recorded Isaac Sim scene exporter for self-hosted browser playback"
requires-python = ">=3.12"

[project.scripts]
isaac-web-exporter = "isaac_web_exporter.export:main"
isaac-web-package-check = "isaac_web_exporter.validate_package:main"

[tool.setuptools.packages.find]
where = ["src"]
